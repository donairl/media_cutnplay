[package]
name = "media_cutnplay"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14", features = ["image", "tokio"] }
ffmpeg-next = { version = "9.0.0", features = ["codec", "format", "filter", "software-scaling"] }
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
